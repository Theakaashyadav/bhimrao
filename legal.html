<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Documents - NGO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --primary:#1f7a4d;
  --secondary:#0f2f44;
  --accent:#f6b43b;
  --light:#f7fbf8;
  --white:#ffffff;
  --text:#333333;
  --muted:#6b7280;
  --border:#e5e7eb;
  --soft-green:#eaf7ef;
  --shadow:0 18px 45px rgba(15,47,68,.12);
  --shadow-hover:0 25px 60px rgba(15,47,68,.18);
  --gradient-main:linear-gradient(135deg,#1f7a4d,#0f2f44);
}

body{
  font-family:"Poppins",sans-serif;
  background:var(--light);
  color:var(--text);
  line-height:1.7;
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

/* HERO */
.legal-hero{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 20px;
  background:
    linear-gradient(rgba(15,47,68,.82),rgba(31,122,77,.75)),
    url("https://images.unsplash.com/photo-1450101499163-c8848c66ca85?q=80&w=1600&auto=format&fit=crop")
    center/cover no-repeat;
}

.legal-hero span{
  display:inline-block;
  padding:10px 22px;
  border-radius:50px;
  background:rgba(255,255,255,.15);
  color:#fff;
  margin-bottom:20px;
  font-weight:600;
}

.legal-hero h1{
  font-size:clamp(34px,6vw,56px);
  color:#fff;
  line-height:1.15;
}

.legal-hero h1 b{
  color:var(--accent);
}

.legal-hero p{
  max-width:760px;
  margin:22px auto 0;
  color:#edf7f0;
  font-size:clamp(15px,2vw,18px);
}

/* DOCUMENTS */
.documents-section{
  padding:90px 0;
}

.section-title{
  text-align:center;
  margin-bottom:55px;
}

.section-title span{
  color:var(--primary);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:14px;
}

.section-title h2{
  font-size:clamp(30px,4vw,42px);
  color:var(--secondary);
  margin-top:10px;
  line-height:1.2;
}

.documents-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.document-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  transition:.4s ease;
  position:relative;
  overflow:hidden;
}

.document-card::before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  background:var(--soft-green);
  border-radius:50%;
  top:-45px;
  right:-45px;
}

.document-card:hover{
  transform:translateY(-10px);
  box-shadow:var(--shadow-hover);
}

.doc-icon,
.document-card h3,
.document-card p,
.doc-meta,
.view-btn{
  position:relative;
  z-index:1;
}

.doc-icon{
  width:70px;
  height:70px;
  border-radius:20px;
  background:var(--gradient-main);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:32px;
  margin-bottom:25px;
}

.document-card h3{
  color:var(--secondary);
  font-size:22px;
  margin-bottom:12px;
  line-height:1.3;
}

.document-card p{
  color:var(--muted);
  margin-bottom:25px;
}

.doc-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:25px;
  font-size:14px;
  color:var(--muted);
  flex-wrap:wrap;
}

.view-btn{
  width:100%;
  border:none;
  outline:none;
  background:var(--gradient-main);
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.3s ease;
}

.view-btn:hover{
  transform:translateY(-3px);
}

/* MODAL */
.document-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:96%;
  max-width:1050px;
  height:90vh;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.modal-header{
  height:62px;
  background:var(--secondary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:0 18px;
}

.modal-header h3{
  font-size:18px;
  line-height:1.3;
}

.close-btn{
  border:0;
  background:#fff;
  color:var(--secondary);
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  font-size:24px;
  line-height:36px;
  cursor:pointer;
}

.pdf-viewer{
  width:100%;
  height:calc(100% - 62px);
  border:0;
  display:block;
}

.pdf-error{
  display:none;
  padding:30px;
  text-align:center;
  color:#b91c1c;
  font-weight:600;
}

/* FOOTER */
.footer{
  background:var(--secondary);
  padding:35px 20px;
  text-align:center;
}

.footer p{
  color:#d7e7df;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .documents-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .documents-section{
    padding:75px 0;
  }
}

@media(max-width:650px){
  .container{
    padding:0 15px;
  }

  .legal-hero{
    min-height:auto;
    padding:75px 15px;
  }

  .documents-section{
    padding:60px 0;
  }

  .section-title{
    margin-bottom:35px;
  }

  .documents-grid{
    grid-template-columns:1fr;
    gap:22px;
  }

  .document-card{
    padding:26px 20px;
    border-radius:22px;
  }

  .doc-icon{
    width:60px;
    height:60px;
    font-size:27px;
    border-radius:17px;
  }

  .document-card h3{
    font-size:20px;
  }

  .modal-box{
    width:100%;
    height:85vh;
    border-radius:16px;
  }

  .modal-header{
    height:58px;
    padding:0 12px;
  }

  .modal-header h3{
    font-size:15px;
  }

  .pdf-viewer{
    height:calc(100% - 58px);
  }
}

@media(max-width:380px){
  .document-card{
    padding:22px 16px;
  }

  .doc-meta{
    flex-direction:column;
    gap:5px;
  }

  .view-btn{
    padding:13px 16px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="document-modal" id="documentModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">Document Viewer</h3>
            <button class="close-btn" onclick="closeDocument()">×</button>
        </div>

        <iframe id="pdfViewer" class="pdf-viewer"></iframe>

        <div class="pdf-error" id="pdfError">
            PDF not found. Please check your file path.
        </div>
    </div>
</div>

<div id="contact-form"></div>
<div id="footer"></div>
<script>
    fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if (menuBtn && navLinks) {
      menuBtn.onclick = () => {
        navLinks.classList.toggle("show");
      };
    }

    loadGoogleTranslate();
  });

function googleTranslateElementInit() {
  const translateBox = document.getElementById("google_translate_element");

  if (translateBox && translateBox.innerHTML.trim() === "") {

    new google.translate.TranslateElement({
      pageLanguage: "pa", // Punjabi is original language
      includedLanguages: "en,hi,ur,pa,bn,ta,te,mr,gu,kn,ml,ne",
      autoDisplay: false,
      multilanguagePage: true,
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, "google_translate_element");

  }
}

function loadGoogleTranslate() {

  // Prevent duplicate script loading
  if (document.getElementById("googleTranslateScript")) {
    if (typeof google !== "undefined" && google.translate) {
      googleTranslateElementInit();
    }
    return;
  }

  const script = document.createElement("script");
  script.id = "googleTranslateScript";
  script.src =
    "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";

  document.body.appendChild(script);
}

    // Load Footer
    fetch("footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);
      
      fetch("contact.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("contact-form").innerHTML = data;
  });

  fetch("floating.html")
  .then(res => res.text())
  .then(data => {
    document.body.insertAdjacentHTML("beforeend", data);
  });

function openDocument(title, fileUrl){
    const modal = document.getElementById("documentModal");
    const modalTitle = document.getElementById("modalTitle");
    const pdfViewer = document.getElementById("pdfViewer");
    const pdfError = document.getElementById("pdfError");

    modalTitle.innerText = title;
    pdfError.style.display = "none";
    pdfViewer.style.display = "block";

    fetch(fileUrl, { method: "HEAD" })
        .then(function(response){
            if(!response.ok){
                throw new Error("PDF not found");
            }

            pdfViewer.src = fileUrl + "#toolbar=0&navpanes=0&scrollbar=1";
            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        })
        .catch(function(){
            pdfViewer.style.display = "none";
            pdfError.style.display = "block";
            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        });
}

function closeDocument(){
    const modal = document.getElementById("documentModal");
    const pdfViewer = document.getElementById("pdfViewer");

    pdfViewer.src = "";
    modal.style.display = "none";
    document.body.style.overflow = "auto";
}

document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closeDocument();
    }
});

document.getElementById("documentModal").addEventListener("click", function(e){
    if(e.target === this){
        closeDocument();
    }
});

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});
</script>
