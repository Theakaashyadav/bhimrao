<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Documents - NGO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --primary:#547A95;
  --primary-dark:#1b2732;
  --secondary:#2C3947;
  --accent:#C2A56D;
  --accent-dark:#9e814d;

  --light:#E8EDF2;
  --white:#ffffff;
  --card:#ffffff;
  --text:#1b2732;
  --muted:#64717f;

  --section-soft:#dce4eb;
  --section-blue:#2C3947;
  --section-dark:#1b2732;
  --section-gold:#f4ead6;

  --border:rgba(194,165,109,.35);
  --shadow:0 18px 45px rgba(27,39,50,.16);
  --shadow-hover:0 28px 70px rgba(27,39,50,.26);

  --gradient-main:linear-gradient(135deg,#1b2732,#2C3947,#547A95);
  --gradient-gold:linear-gradient(135deg,#e3cf9d,#C2A56D,#9e814d);
  --gradient-soft:linear-gradient(135deg,#dce4eb,#E8EDF2,#f4ead6);
}

html,
body{
  width:100%;
  min-height:100%;
  background:var(--gradient-soft);
  overflow-x:hidden;
}

body{
  font-family:"Poppins",sans-serif;
  color:var(--text);
  line-height:1.7;
}

body.modal-open{
  overflow:hidden;
}

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

/* HERO */
.legal-hero{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:90px 20px;
  background:
    linear-gradient(115deg,rgba(27,39,50,.95),rgba(44,57,71,.84),rgba(84,122,149,.76)),
    url("https://images.unsplash.com/photo-1450101499163-c8848c66ca85?q=80&w=1600&auto=format&fit=crop")
    center/cover no-repeat;
}

.legal-hero span{
  display:inline-block;
  padding:10px 22px;
  border-radius:50px;
  background:rgba(255,255,255,.12);
  border:1px solid var(--border);
  color:#f4e1ad;
  margin-bottom:20px;
  font-weight:800;
  backdrop-filter:blur(10px);
}

.legal-hero h1{
  font-size:clamp(30px,6vw,56px);
  color:#fff;
  line-height:1.15;
}

.legal-hero h1 b{
  color:var(--accent);
}

.legal-hero p{
  max-width:760px;
  margin:22px auto 0;
  color:#edf3f7;
  font-size:clamp(14px,2vw,18px);
}

/* DOCUMENTS */
.documents-section{
  padding:90px 0;
  background:transparent !important;
}

.section-title{
  text-align:center;
  margin-bottom:55px;
}

.section-title span{
  display:inline-block;
  color:var(--primary-dark);
  background:var(--gradient-gold);
  border:1px solid var(--border);
  padding:8px 18px;
  border-radius:40px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:14px;
  box-shadow:0 10px 24px rgba(194,165,109,.25);
}

.section-title h2{
  font-size:clamp(28px,4vw,42px);
  color:var(--secondary);
  margin-top:10px;
  line-height:1.2;
}

.section-title h2::after{
  content:"";
  width:90px;
  height:4px;
  background:var(--gradient-gold);
  display:block;
  margin:16px auto 0;
  border-radius:50px;
}

.documents-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.document-card{
  background:rgba(255,255,255,.78);
  border:1px solid var(--border);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  transition:.4s ease;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(12px);
}

.document-card::before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  background:radial-gradient(circle,rgba(194,165,109,.26),transparent 70%);
  border-radius:50%;
  top:-45px;
  right:-45px;
}

.document-card:hover{
  transform:translateY(-10px);
  box-shadow:var(--shadow-hover);
}

.doc-icon,
.document-card h3,
.document-card p,
.doc-meta,
.view-btn{
  position:relative;
  z-index:1;
}

.doc-icon{
  width:70px;
  height:70px;
  border-radius:20px;
  background:var(--gradient-main);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:32px;
  margin-bottom:25px;
  box-shadow:0 12px 30px rgba(27,39,50,.22);
}

.document-card h3{
  color:var(--secondary);
  font-size:22px;
  margin-bottom:12px;
  line-height:1.3;
}

.document-card p{
  color:var(--muted);
  margin-bottom:25px;
}

.doc-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:25px;
  font-size:14px;
  color:var(--muted);
  flex-wrap:wrap;
}

.view-btn{
  width:100%;
  border:none;
  outline:none;
  background:var(--gradient-main);
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.3s ease;
}

.view-btn:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

/* MODAL */
.document-modal{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  height:100dvh;
  background:rgba(27,39,50,.88);
  z-index:99999;
  display:none;
  padding:12px;
}

.document-modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:1050px;
  height:92vh;
  height:92dvh;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}

.modal-header{
  min-height:60px;
  background:var(--gradient-main);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 16px;
  flex-shrink:0;
}

.modal-header h3{
  font-size:17px;
  line-height:1.3;
  max-width:calc(100% - 48px);
  word-break:break-word;
}

.close-btn{
  border:0;
  background:#fff;
  color:var(--secondary);
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  font-size:24px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pdf-viewer{
  width:100%;
  height:100%;
  flex:1;
  border:0;
  display:block;
  background:#f3f4f6;
}

.pdf-error{
  display:none;
  padding:30px;
  text-align:center;
  color:#b91c1c;
  font-weight:600;
}

/* FOOTER */
.footer{
  background:var(--gradient-main);
  padding:35px 20px;
  text-align:center;
}

.footer p{
  color:#edf3f7;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .documents-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .documents-section{
    padding:75px 0;
  }
}

@media(max-width:768px){
  .container{
    padding:0 14px;
  }

  .legal-hero{
    min-height:auto;
    padding:75px 14px;
  }

  .documents-section{
    padding:60px 0;
  }

  .section-title{
    margin-bottom:35px;
  }

  .section-title span{
    font-size:12px;
    padding:7px 14px;
  }

  .section-title h2{
    font-size:26px;
  }

  .documents-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .document-card{
    padding:18px 10px;
    border-radius:20px;
  }

  .document-card:hover{
    transform:none;
  }

  .doc-icon{
    width:52px;
    height:52px;
    font-size:24px;
    border-radius:15px;
    margin-bottom:14px;
  }

  .document-card h3{
    font-size:14px;
    line-height:1.3;
  }

  .document-card p{
    font-size:12px;
    line-height:1.5;
    margin-bottom:14px;
  }

  .doc-meta{
    font-size:11px;
    gap:6px;
    margin-bottom:14px;
  }

  .view-btn{
    padding:10px 12px;
    font-size:12px;
    border-radius:12px;
  }

  .document-modal{
    padding:0;
  }

  .document-modal.active{
    align-items:stretch;
    justify-content:stretch;
  }

  .modal-box{
    width:100%;
    max-width:none;
    height:100vh;
    height:100dvh;
    border-radius:0;
  }

  .modal-header{
    min-height:56px;
    padding:10px 12px;
  }

  .modal-header h3{
    font-size:14px;
  }

  .close-btn{
    width:34px;
    height:34px;
    min-width:34px;
    font-size:22px;
  }

  .pdf-viewer{
    height:calc(100dvh - 56px);
  }
}

@media(max-width:480px){
  .container{
    padding:0 10px;
  }

  .legal-hero{
    padding:65px 10px;
  }

  .legal-hero h1{
    font-size:30px;
  }

  .legal-hero p{
    font-size:13px;
    line-height:1.6;
  }

  .documents-section{
    padding:50px 0;
  }

  .documents-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .document-card{
    padding:14px 7px;
    border-radius:16px;
  }

  .doc-icon{
    width:45px;
    height:45px;
    font-size:20px;
    border-radius:13px;
    margin-bottom:10px;
  }

  .document-card h3{
    font-size:12.5px;
    margin-bottom:7px;
  }

  .document-card p{
    font-size:10.5px;
    line-height:1.45;
  }

  .doc-meta{
    flex-direction:column;
    gap:4px;
    font-size:10px;
  }

  .view-btn{
    padding:8px 7px;
    font-size:10.5px;
  }

  .modal-header h3{
    font-size:13px;
  }
}

@media(max-width:360px){
  .documents-grid{
    gap:7px;
  }

  .document-card{
    padding:12px 6px;
  }

  .document-card h3{
    font-size:11.5px;
  }

  .document-card p{
    font-size:10px;
  }

  .view-btn{
    font-size:10px;
  }
}
</style>

<div class="document-modal" id="documentModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">ਦਸਤਾਵੇਜ਼ ਦਰਸ਼ਕ</h3>
            <button class="close-btn" onclick="closeDocument()">×</button>
        </div>

        <iframe id="pdfViewer" class="pdf-viewer"></iframe>

        <div class="pdf-error" id="pdfError">
            PDF ਨਹੀਂ ਮਿਲੀ। ਕਿਰਪਾ ਕਰਕੇ ਆਪਣਾ ਫਾਇਲ ਪਾਥ ਚੈੱਕ ਕਰੋ।
        </div>

<div id="contact-form"></div>
<div id="footer"></div>

<script>
    fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if (menuBtn && navLinks) {
      menuBtn.onclick = () => {
        navLinks.classList.toggle("show");
      };
    }

    loadGoogleTranslate();
  });

function googleTranslateElementInit() {
  const translateBox = document.getElementById("google_translate_element");

  if (translateBox && translateBox.innerHTML.trim() === "") {

    new google.translate.TranslateElement({
      pageLanguage: "pa", // Punjabi is original language
      includedLanguages: "en,hi,ur,pa,bn,ta,te,mr,gu,kn,ml,ne",
      autoDisplay: false,
      multilanguagePage: true,
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, "google_translate_element");

  }
}

function loadGoogleTranslate() {

  // Prevent duplicate script loading
  if (document.getElementById("googleTranslateScript")) {
    if (typeof google !== "undefined" && google.translate) {
      googleTranslateElementInit();
    }
    return;
  }

  const script = document.createElement("script");
  script.id = "googleTranslateScript";
  script.src =
    "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";

  document.body.appendChild(script);
}

    // Load Footer
    fetch("footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);
      
      fetch("contact.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("contact-form").innerHTML = data;
  });

  fetch("floating.html")
  .then(res => res.text())
  .then(data => {
    document.body.insertAdjacentHTML("beforeend", data);
  });

function openDocument(title, fileUrl){
  const modal = document.getElementById("documentModal");
  const modalTitle = document.getElementById("modalTitle");
  const pdfViewer = document.getElementById("pdfViewer");
  const pdfError = document.getElementById("pdfError");

  modalTitle.innerText = title;
  pdfError.style.display = "none";
  pdfViewer.style.display = "block";

  const isMobile = window.innerWidth <= 650;

  /* Mobile browsers handle PDF iframe better with direct file URL */
  pdfViewer.src = isMobile
    ? fileUrl
    : fileUrl + "#toolbar=0&navpanes=0&scrollbar=1";

  modal.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeDocument(){
  const modal = document.getElementById("documentModal");
  const pdfViewer = document.getElementById("pdfViewer");

  pdfViewer.src = "";
  modal.classList.remove("active");
  document.body.style.overflow = "auto";
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeDocument();
  }
});

document.getElementById("documentModal").addEventListener("click", function(e){
  if(e.target === this){
    closeDocument();
  }
});

</script>
