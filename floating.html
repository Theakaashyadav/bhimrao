<div class="dise-floating-contact">
  <a href="tel:+919501245121" class="dise-float-btn dise-call-btn" title="Call Now">
    <i class="fa-solid fa-phone"></i>
  </a>

  <a href="https://wa.me/919501245121" target="_blank"
     class="dise-float-btn dise-whatsapp-btn"
     title="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
</div>

<style>
/* FLOATING CONTACT WRAPPER */

.dise-floating-contact{
    position:fixed;
    right:24px;
    bottom:24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    z-index:9999;
}

/* BUTTON */

.dise-float-btn{
    position:relative;
    width:62px;
    height:62px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    overflow:hidden;
    backdrop-filter:blur(10px);
    box-shadow:0 18px 40px rgba(0,0,0,.18);
    transition:0.35s ease;
    border:1px solid rgba(255,255,255,.15);
}

/* GLOW EFFECT */

.dise-float-btn::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    transform:scale(0);
    transition:0.4s ease;
}

/* SHINE EFFECT */

.dise-float-btn::after{
    content:"";
    position:absolute;
    width:140%;
    height:140%;
    background:linear-gradient(
        120deg,
        transparent 20%,
        rgba(255,255,255,.22) 50%,
        transparent 80%
    );
    top:-120%;
    left:-120%;
    transform:rotate(25deg);
    transition:.6s ease;
}

.dise-float-btn:hover::after{
    top:100%;
    left:100%;
}

.dise-float-btn:hover::before{
    transform:scale(1.5);
}

/* HOVER */

.dise-float-btn:hover{
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 26px 55px rgba(0,0,0,.24);
}

/* CALL BUTTON */

.dise-call-btn{
    background:linear-gradient(135deg,#ffd56a,#C2A56D,#9e814d);
    color:#1b2732;
}

/* WHATSAPP BUTTON */

.dise-whatsapp-btn{
    background:linear-gradient(135deg,#25D366,#1ebe5d,#128C7E);
    color:#ffffff;
    animation:diseWhatsappPulse 2s infinite;
}

/* ICON */

.dise-float-btn i{
    position:relative;
    z-index:2;
    transition:0.3s ease;
    line-height:1;
}

/* CALL ICON */

.dise-call-btn i{
    font-size:23px;
}

/* WHATSAPP ICON */

.dise-whatsapp-btn i{
    font-size:34px;
}

/* ICON HOVER */

.dise-float-btn:hover i{
    transform:scale(1.15);
}

/* WHATSAPP PULSE */

@keyframes diseWhatsappPulse{
    0%{
        box-shadow:0 0 0 0 rgba(37,211,102,0.48);
    }

    70%{
        box-shadow:0 0 0 20px rgba(37,211,102,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(37,211,102,0);
    }
}

/* MOBILE */

@media(max-width:768px){

    .dise-floating-contact{
        right:18px;
        bottom:18px;
        gap:15px;
    }

    .dise-float-btn{
        width:56px;
        height:56px;
    }

    .dise-call-btn i{
        font-size:22px;
    }

    .dise-whatsapp-btn i{
        font-size:31px;
    }
}

@media(max-width:576px){

    .dise-floating-contact{
        right:14px;
        bottom:14px;
        gap:12px;
    }

    .dise-float-btn{
        width:50px;
        height:50px;
    }

    .dise-call-btn i{
        font-size:19px;
    }

    .dise-whatsapp-btn i{
        font-size:27px;
    }
}

@media(max-width:380px){

    .dise-floating-contact{
        right:12px;
        bottom:12px;
    }

    .dise-float-btn{
        width:46px;
        height:46px;
    }

    .dise-call-btn i{
        font-size:17px;
    }

    .dise-whatsapp-btn i{
        font-size:24px;
    }
}
</style>
